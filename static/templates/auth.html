{% extends 'base.html' %}{% block title %}{% if mode=='login' %}Вход{% else %}Регистрация{% endif %}{% endblock %}{% block content %}
<div class="page-head"><h1>{% if mode=='login' %}Вход в кабинет{% else %}Регистрация посетителя{% endif %}</h1><p>Учётная запись помогает сохранить переписку по учебным сценариям.</p></div>
<form class="form" method="post"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label>Логин<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label>
<label>Пароль<input name="password" required type="password" minlength="12" autocomplete="{{ 'current-password' if mode=='login' else 'new-password' }}"></label>
<button type="submit">{{ 'Войти' if mode=='login' else 'Зарегистрироваться' }}</button></form>
{% endblock %}
